<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XIMING Travel Content</title><style>:root{--bg:#f7f5ef;--card:#fff;--ink:#171714;--muted:#8b8981;--line:#e8e4da;--yellow:#f2c94c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:22px 16px 110px}h1{font-size:24px;margin:0}.sub,.muted{font-size:12px;color:var(--muted)}.top,.cardTop,.sectionHead{display:flex;justify-content:space-between;align-items:flex-start}.pill,.btn,.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.trip,.filters,.pipeline,.inbox,.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.active{background:#171714!important;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.big{font-size:20px;font-weight:750}.sectionHead{margin-top:22px}.sectionHead h2{font-size:16px;margin:0}.thumb{min-width:92px;height:118px;border-radius:15px;background:#e8e4da;display:flex;align-items:end;padding:9px;font-size:11px}.title{font-size:18px;font-weight:760;margin:4px 0}.stage{min-width:66px;text-align:center}.dot{height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f2f1ed;color:#aaa}.done .dot{background:#deddd8;color:#777}.current .dot{background:var(--yellow);color:#332900;box-shadow:0 0 0 4px rgba(242,201,76,.18)}.stageName{font-size:10px;color:#888;margin-top:5px}.bar{height:5px;background:#eeeae1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#222}.cardActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.cardActions button,.yellowBtn{border:0;border-radius:12px;padding:11px}.primary{background:#171714;color:#fff}.delete{background:#fff0ee;color:#b42318}.empty{text-align:center;padding:40px 18px;color:#8b8981}.fab{position:fixed;right:20px;bottom:24px;border:0;background:#171714;color:#fff;border-radius:18px;padding:15px 18px;font-weight:700}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}.overlay.show{display:flex}.sheet{background:var(--bg);width:100%;max-height:92vh;border-radius:26px 26px 0 0;padding:18px 16px 32px;overflow:auto}.sheetTop{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:34px;height:34px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0}.yellowBtn{width:100%;background:var(--yellow);font-weight:800}.note{font-size:12px;color:#777;line-height:1.5}@media(min-width:700px){.fab{right:calc(50% - 340px)}}</style></head><body><div class="app"><div class="top"><div><h1>XIMING TRAVEL CONTENT</h1><div class="sub">Plan · Shoot · Edit · Publish</div></div><button class="pill">📥 Inbox</button></div><div class="trip"><button class="pill active">🇯🇵 Japan 2026</button><button class="pill">＋ 新旅行</button></div><div class="grid"><div class="mini"><b>TODAY</b><div class="big">📍 —</div><div class="muted">No shots yet</div></div><div class="mini"><b>🎒 TRAVEL GEAR</b><div class="big">0 / 0</div><div class="muted">Tap to add gear</div></div></div><div class="sectionHead"><h2>灵感 INBOX</h2><span class="muted">先收集，之后再分类</span></div><div class="inbox"><div class="thumb">＋ 添加</div></div><div class="sectionHead"><h2>MY CONTENT</h2><span class="muted">Auto saved</span></div><div class="filters"><button class="filter active">全部</button><button class="filter">🟡 进行中</button><button class="filter">🎬 Video</button><button class="filter">📸 Photo</button><button class="filter">✓ 已完成</button></div><div id="cards"></div></div><button class="fab" onclick="newContent()">＋ NEW CONTENT</button><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><script>let data=JSON.parse(localStorage.getItem('ximingTravelV2')||'[]');function save(){localStorage.setItem('ximingTravelV2',JSON.stringify(data))}function render(){const el=document.getElementById('cards');if(!data.length){el.innerHTML='<div class="card empty"><b>还没有 Content</b><p>按右下角 ＋ NEW CONTENT 建立你的第一个项目。</p></div>';return}el.innerHTML=data.map(c=>{const pct=Math.round(c.stage/c.stages.length*100);const stages=c.stages.map((s,i)=>'<div class="stage '+(i<c.stage?'done':i===c.stage?'current':'')+'"><div class="dot">'+(i<c.stage?'✓':String(i+1).padStart(2,'0'))+'</div><div class="stageName">'+s+'</div></div>').join('');return '<div class="card"><div class="cardTop"><div><div class="muted">'+(c.type==='VIDEO'?'🎬 VIDEO':'📸 PHOTO')+'</div><div class="title">'+c.title+'</div><div class="muted">'+c.place+'</div></div><div>'+pct+'%</div></div><div class="pipeline">'+stages+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="cardActions"><button onclick="duplicate('+c.id+')">⧉ 复制</button><button class="delete" onclick="deleteContent('+c.id+')">🗑 删除</button><button class="primary" onclick="openProject('+c.id+')">打开 →</button></div></div>'}).join('')}function duplicate(id){const c=JSON.parse(JSON.stringify(data.find(x=>x.id===id)));c.id=Date.now();c.title+=' COPY';data.unshift(c);save();render()}function deleteContent(id){const c=data.find(x=>x.id===id);if(!c)return;if(confirm('确定删除「'+c.title+'」吗？')){data=data.filter(x=>x.id!==id);save();render()}}function closeSheet(){overlay.classList.remove('show')}function show(h){sheet.innerHTML=h;overlay.classList.add('show')}function newContent(){show('<div class="sheetTop"><b>＋ NEW CONTENT</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><select id="ctype" class="input"><option value="VIDEO">🎬 VIDEO</option><option value="PHOTO">📸 PHOTO</option></select><input id="ctitle" class="input" placeholder="Content Title"><input id="cplace" class="input" placeholder="地点 / 日期"><textarea id="cidea" class="input" placeholder="我想拍什么 / Content Idea"></textarea><button class="yellowBtn" onclick="createContent()">建立 Content</button></div>')}function createContent(){const type=ctype.value,title=ctitle.value||'UNTITLED CONTENT',place=cplace.value||'Location TBD';const stages=type==='PHOTO'?['参考','规划','Shot List','拍摄','素材','修图','发布','复盘']:['参考','规划','Shot List','拍摄','素材','剪辑','发布','复盘'];data.unshift({id:Date.now(),type,title,place,stage:0,stages});save();render();closeSheet()}function openProject(id){const c=data.find(x=>x.id===id);show('<div class="sheetTop"><div><b>'+(c.type==='VIDEO'?'🎬 ':'📸 ')+c.title+'</b><div class="muted">'+c.place+'</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><b>项目已建立</b><p class="note">Reference → Planning → Shot List → Shoot → Material → Edit/Retouch → Publish → Review</p><button class="delete yellowBtn" onclick="deleteFromProject('+id+')">🗑 删除这个 Content</button></div>')}function deleteFromProject(id){closeSheet();deleteContent(id)}overlay.addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});render();</script></body></html>
