<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XIMING Travel Content</title><style>:root{--bg:#f7f5ef;--card:#fff;--ink:#171714;--muted:#8b8981;--line:#e8e4da;--yellow:#f2c94c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:22px 16px 110px}h1{font-size:24px;margin:0}.sub,.muted{font-size:12px;color:var(--muted)}.top,.cardTop,.sectionHead{display:flex;justify-content:space-between;align-items:flex-start}.pill,.btn,.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.trip,.filters,.pipeline,.inbox,.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.active{background:#171714!important;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.big{font-size:20px;font-weight:750}.sectionHead{margin-top:22px}.sectionHead h2{font-size:16px;margin:0}.thumb{min-width:92px;height:118px;border-radius:15px;background:#e8e4da;display:flex;align-items:end;padding:9px;font-size:11px}.title{font-size:18px;font-weight:760;margin:4px 0}.stage{min-width:66px;text-align:center}.dot{height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f2f1ed;color:#aaa}.done .dot{background:#deddd8;color:#777}.current .dot{background:var(--yellow);color:#332900;box-shadow:0 0 0 4px rgba(242,201,76,.18)}.stageName{font-size:10px;color:#888;margin-top:5px}.bar{height:5px;background:#eeeae1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#222}.cardActions,.row{display:flex;gap:8px;margin-top:12px}.cardActions button,.row>*{flex:1}.cardActions button,.yellowBtn{border:0;border-radius:12px;padding:11px}.primary{background:#171714;color:#fff}.fab{position:fixed;right:20px;bottom:24px;border:0;background:#171714;color:#fff;border-radius:18px;padding:15px 18px;font-weight:700}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}.overlay.show{display:flex}.sheet{background:var(--bg);width:100%;max-height:92vh;border-radius:26px 26px 0 0;padding:18px 16px 32px;overflow:auto}.sheetTop{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:34px;height:34px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.tab.active{background:var(--yellow)!important;color:#111}.shot{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.ref{width:70px;height:70px;border-radius:13px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:24px}.shotInfo{flex:1}.shotInfo small{display:block;color:#888;margin-top:4px}.check{border:0;width:34px;height:34px;border-radius:50%;background:#eee}.check.done{background:#d9d8d2}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0}.yellowBtn{width:100%;background:var(--yellow);font-weight:800}.note{font-size:12px;color:#777;line-height:1.5}@media(min-width:700px){.fab{right:calc(50% - 340px)}}</style></head><body><div class="app"><div class="top"><div><h1>XIMING TRAVEL CONTENT</h1><div class="sub">Plan · Shoot · Edit · Publish</div></div><button class="pill" onclick="openInbox()">📥 Inbox</button></div><div class="trip"><button class="pill active">🇯🇵 Japan 2026</button><button class="pill">＋ 新旅行</button></div><div class="grid"><div class="mini"><b>TODAY · OCT 05</b><div class="big">📍 Fuji</div><div class="muted">18 shots waiting</div></div><div class="mini" onclick="gear()"><b>🎒 TRAVEL GEAR</b><div class="big">8 / 10</div><div class="muted">Tap to check gear</div></div></div><div class="sectionHead"><h2>灵感 INBOX</h2><span class="muted">先收集，之后再分类</span></div><div class="inbox"><div class="thumb">东京塔 · PHOTO</div><div class="thumb">新宿走路 · VIDEO</div><div class="thumb">Fuji Road · VIDEO</div><div class="thumb" onclick="openInbox()">＋ 添加</div></div><div class="sectionHead"><h2>MY CONTENT</h2><span class="muted">Auto saved</span></div><div class="filters"><button class="filter active">全部</button><button class="filter">🟡 进行中</button><button class="filter">🎬 Video</button><button class="filter">📸 Photo</button><button class="filter">✓ 已完成</button></div><div id="cards"></div></div><button class="fab" onclick="newContent()">＋ NEW CONTENT</button><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><script>const defaults=[{id:1,type:'VIDEO',title:'JAPAN VLOG 01',place:'Tokyo · Day 01',stage:3,stages:['参考','规划','Shot List','拍摄','素材','剪辑','发布','复盘'],shots:[['机场拖行李','Narita · 0.5× · 后方跟拍 · 5 sec'],['飞机窗外','Window · 静止 · 3 sec'],['走出新宿站','Shinjuku · Wide · 低机位'],['新宿街头','Night · 1× · Walk']]},{id:2,type:'PHOTO',title:'TOKYO TOWER PHOTO',place:'Tokyo Tower',stage:4,stages:['参考','规划','Shot List','拍摄','素材','修图','发布','复盘'],shots:[['东京塔全身照','1× · 人物右 1/3 · Golden Hour'],['回头照','1× · 回头 · 傍晚'],['街边坐姿','2× · 坐姿 · Night']]},{id:3,type:'VIDEO',title:'FUJI ROAD TRIP',place:'Fuji · Day 03',stage:1,stages:['参考','规划','Shot List','拍摄','素材','剪辑','发布','复盘'],shots:[['公路开场','Fuji · Wide · Sunny'],['车窗富士山','1× · 静止 · Day'],['走向富士山','0.5× · 跟拍 · 6 sec']]}];let data=JSON.parse(localStorage.getItem('ximingTravelV1')||'null')||defaults;function save(){localStorage.setItem('ximingTravelV1',JSON.stringify(data))}function render(){let el=document.getElementById('cards');el.innerHTML='';data.forEach(c=>{let pct=Math.round(c.stage/c.stages.length*100),stages=c.stages.map((s,i)=>`<div class="stage ${i<c.stage?'done':i===c.stage?'current':''}"><div class="dot">${i<c.stage?'✓':String(i+1).padStart(2,'0')}</div><div class="stageName">${s}</div></div>`).join('');el.innerHTML+=`<div class="card"><div class="cardTop"><div><div class="muted">${c.type==='VIDEO'?'🎬 VIDEO':'📸 PHOTO'}</div><div class="title">${c.title}</div><div class="muted">${c.place}</div></div><div>${pct}%</div></div><div class="pipeline">${stages}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="cardActions"><button onclick="duplicate(${c.id})">⧉ 复制</button><button class="primary" onclick="openProject(${c.id})">打开项目 →</button></div></div>`});save()}function duplicate(id){let c=JSON.parse(JSON.stringify(data.find(x=>x.id===id)));c.id=Date.now();c.title+=' COPY';data.unshift(c);render()}function closeSheet(){overlay.classList.remove('show')}function show(h){sheet.innerHTML=h;overlay.classList.add('show')}function openProject(id,tab=0){let c=data.find(x=>x.id===id),tabs=c.stages.map((s,i)=>`<button class="tab ${i===tab?'active':''}" onclick="openProject(${id},${i})">${i<c.stage?'✓ ':i===c.stage?'🟡 ':''}${s}</button>`).join(''),body='';if(tab===0)body=`<div class="panel"><b>REFERENCE</b><p class="note">保存照片、视频、Screenshot、Link，并绑定到 Shot List。</p><div class="inbox"><div class="thumb">Reference 01</div><div class="thumb">Reference 02</div><div class="thumb">＋ Add</div></div></div>`;else if(tab===1)body=`<div class="panel"><b>CONTENT BRIEF</b><input class="input" value="${c.title}"><input class="input" value="${c.place}"><textarea class="input" placeholder="Content Idea / Hook / Ending"></textarea><button class="yellowBtn" onclick="completeStage(${id},1)">✓ 完成规划</button></div>`;else if(tab===2||tab===3)body=`<div class="panel"><b>${tab===2?'SHOT LIST':'SHOOT MODE'}</b><p class="note">${tab===3?'查看 Reference 后按「拍到了」；跳过的镜头之后补拍。':'拍摄前设计镜头，并与 Reference 绑定。'}</p>${c.shots.map((s,i)=>`<div class="shot"><div class="ref">${c.type==='VIDEO'?'🎥':'📸'}</div><div class="shotInfo"><b>${String(i+1).padStart(2,'0')} · ${s[0]}</b><small>${s[1]}</small></div><button class="check" onclick="this.classList.toggle('done');this.innerText=this.classList.contains('done')?'✓':''"></button></div>`).join('')}<button class="yellowBtn" onclick="completeStage(${id},${tab})">✓ 完成${c.stages[tab]}</button></div>`;else body=`<div class="panel"><b>${c.stages[tab]}</b><p class="note">完成后当前黄灯熄灭，下一阶段自动亮起。</p><button class="yellowBtn" onclick="completeStage(${id},${tab})">✓ 完成${c.stages[tab]}</button></div>`;show(`<div class="sheetTop"><div><b>${c.type==='VIDEO'?'🎬':'📸'} ${c.title}</b><div class="muted">${c.place}</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="tabs">${tabs}</div>${body}`)}function completeStage(id,tab){let c=data.find(x=>x.id===id);if(tab>=c.stage)c.stage=Math.min(tab+1,c.stages.length);save();render();openProject(id,Math.min(c.stage,c.stages.length-1))}function newContent(){show(`<div class="sheetTop"><b>＋ NEW CONTENT</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><div class="row"><button class="pill" onclick="ctype.value='VIDEO'">🎬 VIDEO</button><button class="pill" onclick="ctype.value='PHOTO'">📸 PHOTO</button></div><input id="ctype" type="hidden" value="VIDEO"><input id="ctitle" class="input" placeholder="Content Title"><input id="cplace" class="input" placeholder="地点 / 日期"><textarea id="cidea" class="input" placeholder="我想拍什么 / Content Idea"></textarea><button class="yellowBtn" onclick="createContent()">✨ GENERATE PLAN + SHOT LIST</button><p class="note">当前为模板生成；未来可接 AI/API。</p></div>`)}function createContent(){let type=ctype.value,title=ctitle.value||'UNTITLED CONTENT',place=cplace.value||'Location TBD',stages=type==='PHOTO'?['参考','规划','Shot List','拍摄','素材','修图','发布','复盘']:['参考','规划','Shot List','拍摄','素材','剪辑','发布','复盘'],shots=type==='PHOTO'?[['主构图','Reference · Pose · 1×'],['回头照','Golden Hour'],['环境人像','Wide']]:[['Opening Hero Shot','Wide · 3 sec'],['人物动作','0.5× · Follow · 5 sec'],['环境 B-roll','1× · 3 sec'],['Ending','Hero · 3 sec']];data.unshift({id:Date.now(),type,title,place,stage:0,stages,shots});save();render();closeSheet()}function openInbox(){show(`<div class="sheetTop"><b>📥 灵感 INBOX</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><p class="note">照片 / Video / Screenshot / Link → 之后加入 Content。</p><div class="inbox"><div class="thumb">东京塔</div><div class="thumb">新宿走路</div><div class="thumb">Fuji Road</div><div class="thumb">＋ Upload</div></div></div>`)}function gear(){show(`<div class="sheetTop"><b>🎒 TRAVEL GEAR</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel">${['iPhone','Canon R50','Lens','Spare Battery','Powerbank','Charging Cable','SD Card','Spare SD Card','Tripod','Mic'].map((x,i)=>`<div class="shot"><div class="shotInfo"><b>${x}</b></div><button class="check ${i<8?'done':''}" onclick="this.classList.toggle('done');this.innerText=this.classList.contains('done')?'✓':''">${i<8?'✓':''}</button></div>`).join('')}</div>`)}overlay.addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});render();</script></body></html>
