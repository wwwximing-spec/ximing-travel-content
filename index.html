<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XIMING Travel Content</title><style>:root{--bg:#f7f5ef;--card:#fff;--ink:#171714;--muted:#88857d;--line:#e7e2d7;--y:#f2c94c;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{max-width:720px;margin:auto;padding:22px 16px 110px}.top,.head,.sheetTop,.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}h1{font-size:23px;margin:0}.muted,.note{font-size:12px;color:var(--muted)}.pill,.filter,.tab,.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap}.active{background:#171714!important;color:#fff}.trip,.filters,.pipe,.tabs,.mediaStrip{display:flex;gap:8px;overflow:auto;margin:14px 0;-webkit-overflow-scrolling:touch}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.mini,.panel,.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.mini{min-height:96px}.section{margin-top:22px;font-weight:800}.title{font-size:18px;font-weight:800}.stage{min-width:66px;text-align:center}.dot{height:30px;border-radius:10px;background:#f0efeb;color:#aaa;display:flex;align-items:center;justify-content:center}.done .dot{background:#deddd8;color:#777}.current .dot{background:var(--y);color:#332900;box-shadow:0 0 0 4px #f2c94c2e}.stage small{display:block;color:#888;margin-top:5px}.bar{height:5px;background:#ece8df;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#222}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}.actions button,.wide,.small{border:0;border-radius:12px;padding:11px}.primary{background:#171714;color:#fff}.danger{background:#fff0ee;color:var(--red)}.soft{background:#f0efeb}.wide{width:100%;background:var(--y);font-weight:800}.fab{position:fixed;right:20px;bottom:24px;border:0;background:#171714;color:#fff;border-radius:18px;padding:15px 18px;font-weight:800}.overlay{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;z-index:5}.overlay.show{display:flex}.sheet{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px 35px}.close{border:0;border-radius:50%;width:34px;height:34px}.tab.active{background:var(--y)!important;color:#111}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:5px 0;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.media{width:92px;min-width:92px;height:118px;border-radius:14px;object-fit:cover;background:#eee}.media video{width:100%;height:100%}.preview{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#eee}.badge{display:inline-block;padding:5px 8px;background:#f0efeb;border-radius:99px;font-size:11px;margin:2px}.shot{border-bottom:1px solid #eee;padding:12px 0}.shot:last-child{border:0}.shotTop{display:flex;justify-content:space-between;gap:8px}.empty{text-align:center;color:#888;padding:30px 10px}.check{border:0;border-radius:10px;padding:8px 10px}.toast{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:99px;z-index:10}.toast.show{display:block}@media(min-width:700px){.fab{right:calc(50% - 340px)}}</style></head><body><div class="app"><div class="top"><div><h1>XIMING TRAVEL CONTENT</h1><div class="muted">Plan · Shoot · Edit · Publish</div></div><button class="pill" onclick="openInbox()">📥 Inbox</button></div><div class="trip"><button class="pill active">🇯🇵 Japan 2026</button><button class="pill" onclick="toast('Trip 管理下一步接云端')">＋ 新旅行</button></div><div class="grid"><div class="mini"><b>TODAY</b><div id="today" class="title">No shots</div><div class="muted">按日期自动筛选</div></div><div class="mini" onclick="gear()"><b>🎒 TRAVEL GEAR</b><div id="gearCount" class="title">0 / 0</div><div class="muted">Tap to manage</div></div></div><div class="section">灵感 INBOX</div><div id="inboxPreview" class="mediaStrip"></div><div class="section">MY CONTENT</div><div class="filters"><button class="filter active" onclick="filter='all';render()">全部</button><button class="filter" onclick="filter='active';render()">🟡进行中</button><button class="filter" onclick="filter='VIDEO';render()">🎬 Video</button><button class="filter" onclick="filter='PHOTO';render()">📸 Photo</button><button class="filter" onclick="filter='done';render()">✓完成</button></div><div id="cards"></div></div><button class="fab" onclick="newContent()">＋ NEW CONTENT</button><div id="overlay" class="overlay"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script>const PV=['参考','规划','Shot List','拍摄','素材','剪辑','发布','复盘'],PP=['参考','规划','Shot List','拍摄','素材','修图','发布','复盘'];let data=JSON.parse(localStorage.getItem('ximingV4')||'[]'),inbox=JSON.parse(localStorage.getItem('ximingInboxV4')||'[]'),gearData=JSON.parse(localStorage.getItem('ximingGearV4')||'[]'),filter='all',undo=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem('ximingV4',JSON.stringify(data));localStorage.setItem('ximingInboxV4',JSON.stringify(inbox));localStorage.setItem('ximingGearV4',JSON.stringify(gearData))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}function show(h){$('sheet').innerHTML=h;$('overlay').classList.add('show')}function closeSheet(){$('overlay').classList.remove('show')}$('overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()};function render(){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.textContent.includes(filter==='all'?'全部':filter==='active'?'进行中':filter==='done'?'完成':filter==='VIDEO'?'Video':'Photo')));let list=data.filter(c=>filter==='all'||filter==='active'&&c.stage<8||filter==='done'&&c.stage>=8||c.type===filter);$('cards').innerHTML=list.length?list.map(c=>{let pct=Math.min(100,Math.round(c.stage/8*100));return `<div class="card"><div class="head"><div><div class="muted">${c.type==='PHOTO'?'📸 PHOTO':'🎬 VIDEO'}</div><div class="title">${esc(c.title)}</div><div class="muted">${esc((c.locations||[]).join(' · '))} ${c.start||''}${c.end?' → '+c.end:''}</div></div><b>${pct}%</b></div><div class="pipe">${c.stages.map((s,i)=>`<div class="stage ${i<c.stage?'done':i===c.stage?'current':''}"><div class="dot">${i<c.stage?'✓':String(i+1).padStart(2,'0')}</div><small>${s}</small></div>`).join('')}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="actions"><button onclick="duplicate(${c.id})">⧉复制</button><button class="danger" onclick="del(${c.id})">🗑删除</button><button class="primary" onclick="openProject(${c.id})">打开→</button></div></div>`}).join(''):'<div class="card empty">还没有 Content<br>按 ＋ NEW CONTENT 开始</div>';let shots=data.flatMap(c=>(c.shots||[]).filter(s=>s.date===new Date().toISOString().slice(0,10)&&!s.done));$('today').textContent=shots.length?shots.length+' shots':'No shots';$('gearCount').textContent=gearData.filter(x=>x.done).length+' / '+gearData.length;$('inboxPreview').innerHTML=inbox.slice(0,5).map(x=>`<div class="item" style="min-width:110px">${esc(x.title)}</div>`).join('')+'<button class="pill" onclick="openInbox()">＋添加</button>';save()}function newContent(){show(`<div class="sheetTop"><b>＋ NEW CONTENT</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><select id="nt" class="input"><option value="PHOTO">📸 PHOTO</option><option value="VIDEO">🎬 VIDEO</option></select><input id="nn" class="input" placeholder="Content Title"><div class="two"><label class="note">Start Date<input id="ns" type="date" class="input"></label><label class="note">End Date<input id="ne" type="date" class="input"></label></div><input id="nl" class="input" placeholder="Locations，用逗号分开"><textarea id="ni" class="input" placeholder="我想拍什么 / Content Idea"></textarea><button class="wide" onclick="createContent()">建立 Content</button></div>`)}function createContent(){let type=$('nt').value;data.unshift({id:Date.now(),type,title:$('nn').value||'UNTITLED',start:$('ns').value,end:$('ne').value,locations:$('nl').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),idea:$('ni').value,stage:0,stages:type==='PHOTO'?PP:PV,references:[],planning:{},shots:[],material:[],editSteps:type==='PHOTO'?['选片','修图','调色','检查','导出']:['选素材','故事线','粗剪','精剪','音乐','字幕','音效','调色','封面','导出'],publish:{},review:{}});render();closeSheet()}function duplicate(id){let c=structuredClone(data.find(x=>x.id===id));c.id=Date.now();c.title+=' COPY';c.stage=0;c.shots.forEach(x=>{x.done=false;x.skipped=false});data.unshift(c);render()}function del(id){let c=data.find(x=>x.id===id);if(!c||!confirm('确定删除「'+c.title+'」吗？'))return;undo={c,index:data.indexOf(c)};data=data.filter(x=>x.id!==id);render();toast('已删除；刷新前可用 Undo');}function openProject(id,tab){let c=data.find(x=>x.id===id);if(!c)return;tab=tab??Math.min(c.stage,7);show(`<div class="sheetTop"><div><b>${c.type==='PHOTO'?'📸':'🎬'} ${esc(c.title)}</b><div class="muted">${c.start||''}${c.end?' → '+c.end:''}</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="tabs">${c.stages.map((s,i)=>`<button class="tab ${i===tab?'active':''}" onclick="openProject(${id},${i})">${i<c.stage?'✓ ':i===c.stage?'🟡 ':''}${s}</button>`).join('')}</div>${section(c,tab)}`)}function section(c,t){return t===0?refs(c):t===1?planning(c):t===2?shotlist(c):t===3?shoot(c):t===4?material(c):t===5?edit(c):t===6?publish(c):review(c)}function refs(c){return `<div class="panel"><b>REFERENCE</b><p class="note">照片可多选；Video 可直接选文件；也可以贴 Link。当前媒体先存在此设备浏览器，接云端后会跨设备同步。</p><input id="rf" type="file" accept="image/*,video/*" multiple class="input" onchange="addFiles(${c.id},this.files)"><input id="rl" class="input" placeholder="Paste Instagram / XHS / TikTok link"><button class="soft small" style="width:100%" onclick="addLink(${c.id})">＋ Add Link</button><div class="mediaStrip">${(c.references||[]).map((r,i)=>r.kind==='image'?`<div><img class="media" src="${r.url}"><button class="small danger" onclick="removeRef(${c.id},${i})">删除</button></div>`:r.kind==='video'?`<div><video class="media" src="${r.url}" controls></video><button class="small danger" onclick="removeRef(${c.id},${i})">删除</button></div>`:`<div class="item" style="min-width:160px"><small>LINK</small><br>${esc(r.url)}<br><button class="small danger" onclick="removeRef(${c.id},${i})">删除</button></div>`).join('')}</div><button class="wide" onclick="complete(${c.id},0)">✓ 完成参考阶段</button></div>`}function addFiles(id,files){let c=data.find(x=>x.id===id);[...files].forEach((f,i)=>{let reader=new FileReader();reader.onload=e=>{c.references.push({id:Date.now()+i,kind:f.type.startsWith('video')?'video':'image',name:f.name,url:e.target.result,main:c.references.length===0});save();openProject(id,0)};reader.readAsDataURL(f)})}function addLink(id){let v=$('rl').value.trim();if(!v)return;c=data.find(x=>x.id===id);c.references.push({id:Date.now(),kind:'link',url:v});save();openProject(id,0)}function removeRef(id,i){data.find(x=>x.id===id).references.splice(i,1);save();openProject(id,0)}function planning(c){let p=c.planning||{};return `<div class="panel"><b>CONTENT BRIEF</b><input id="theme" class="input" value="${esc(p.theme||'')}" placeholder="Theme"><input id="style" class="input" value="${esc(p.style||'')}" placeholder="Style / Mood"><input id="platform" class="input" value="${esc(p.platform||'')}" placeholder="Target Platform"><div class="two"><label class="note">Start<input id="ps" type="date" class="input" value="${c.start||''}"></label><label class="note">End<input id="pe" type="date" class="input" value="${c.end||''}"></label></div><input id="pl" class="input" value="${esc((c.locations||[]).join(', '))}" placeholder="Multiple Locations"><input id="look" class="input" value="${esc(p.look||'')}" placeholder="Outfit / Look"><textarea id="hook" class="input" placeholder="Hook">${esc(p.hook||'')}</textarea><textarea id="ending" class="input" placeholder="Ending / Final Output">${esc(p.ending||'')}</textarea><button class="wide" onclick="savePlan(${c.id})">保存并完成规划</button></div>`}function savePlan(id){let c=data.find(x=>x.id===id);c.start=$('ps').value;c.end=$('pe').value;c.locations=$('pl').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);c.planning={theme:$('theme').value,style:$('style').value,platform:$('platform').value,look:$('look').value,hook:$('hook').value,ending:$('ending').value};complete(id,1)}function shotlist(c){return `<div class="panel"><div class="head"><b>SHOT LIST</b><button class="small primary" onclick="addShotForm(${c.id})">＋ Shot</button></div><p class="note">一张 Reference 可以拆多个 Shot。Shot 可独立安排日期、地点、Must Shoot 与条件。</p>${(c.shots||[]).map((s,i)=>`<div class="shot"><div class="shotTop"><b>${i+1}. ${esc(s.title)}</b><span>${s.must?'⭐':''}</span></div><div class="note">${esc(s.type||'Shoot')} · ${esc(s.date||'Any Day')} · ${esc(s.location||'Any Location')}<br>${esc(s.details||'')} ${s.condition?' · '+esc(s.condition):''}</div><button class="small danger" onclick="removeShot(${c.id},${i})">删除</button></div>`).join('')}<button class="wide" onclick="complete(${c.id},2)">✓ 完成 Shot List</button></div>`}function addShotForm(id){show($('sheet').innerHTML+`<div class="panel"><b>NEW SHOT</b><input id="st" class="input" placeholder="Shot Name"><select id="stype" class="input"><option>Shoot</option><option>Edit Element</option><option>Text</option></select><div class="two"><input id="sd" type="date" class="input"><input id="sl" class="input" placeholder="Location"></div><input id="sc" class="input" placeholder="Condition: Golden Hour / Night / Indoor..."><input id="sdet" class="input" placeholder="Pose / 构图 / Lens / Movement / Duration"><label><input id="sm" type="checkbox"> ⭐ Must Shoot</label><button class="wide" onclick="addShot(${id})">加入 Shot List</button></div>`)}function addShot(id){let c=data.find(x=>x.id===id);c.shots.push({title:$('st').value||'Untitled Shot',type:$('stype').value,date:$('sd').value,location:$('sl').value,condition:$('sc').value,details:$('sdet').value,must:$('sm').checked,done:false,skipped:false,results:[]});save();openProject(id,2)}function removeShot(id,i){data.find(x=>x.id===id).shots.splice(i,1);save();openProject(id,2)}function shoot(c){let shootable=(c.shots||[]).filter(s=>s.type==='Shoot');return `<div class="panel"><b>SHOOT MODE</b><p class="note">只显示现场要拍的 Shot；Edit Element / Text 不会混进拍摄任务。</p>${shootable.map((s,i)=>`<div class="item"><b>${s.must?'⭐ ':''}${esc(s.title)}</b><div class="note">${esc(s.date||'Any Day')} · 📍${esc(s.location||'Any Location')}<br>${esc(s.details||'')}</div><div class="row"><button class="small soft" onclick="shotState(${c.id},'${esc(s.title)}',true)">✓ 拍到了</button><button class="small soft" onclick="shotState(${c.id},'${esc(s.title)}',false)">↷ 跳过</button></div></div>`).join('')||'<div class="empty">还没有 Shoot 类型镜头</div>'}<button class="wide" onclick="complete(${c.id},3)">✓ 完成拍摄阶段</button></div>`}function shotState(id,title,ok){let s=data.find(x=>x.id===id).shots.find(x=>x.title===title);s.done=ok;s.skipped=!ok;save();openProject(id,3)}function material(c){return `<div class="panel"><b>MATERIAL · Reference → Result</b><p class="note">一次可多选照片/Video。当前先存在本设备；云端 Storage 接好后会跨设备。</p><input type="file" accept="image/*,video/*" multiple class="input" onchange="addMaterial(${c.id},this.files)">${(c.material||[]).map((m,i)=>`<div class="item"><b>${esc(m.name)}</b><select class="input" onchange="setMat(${c.id},${i},this.value)"><option>${m.status||'Usable'}</option><option>⭐ FINAL / BEST</option><option>✓ Usable</option><option>△ Backup</option><option>✕ Missing / Don’t Use</option></select></div>`).join('')}<button class="wide" onclick="complete(${c.id},4)">✓ 完成素材阶段</button></div>`}function addMaterial(id,files){let c=data.find(x=>x.id===id);[...files].forEach(f=>c.material.push({name:f.name,status:'✓ Usable'}));save();openProject(id,4)}function setMat(id,i,v){data.find(x=>x.id===id).material[i].status=v;save()}function edit(c){return `<div class="panel"><b>${c.type==='PHOTO'?'RETOUCH':'EDIT'}</b><p class="note">流程可自定义；Video 可把 Reference timing 写进步骤。</p>${c.editSteps.map((x,i)=>`<div class="shot"><b>${i+1}. ${esc(x)}</b></div>`).join('')}<input id="newstep" class="input" placeholder="＋ 自定义步骤，例如 拼贴排版 / 00:00–00:02 Hook"><button class="small soft" onclick="addStep(${c.id})">＋ Add Step</button><div style="height:10px"></div><button class="wide" onclick="complete(${c.id},5)">✓ FINAL EXPORT</button></div>`}function addStep(id){let v=$('newstep').value.trim();if(v)data.find(x=>x.id===id).editSteps.push(v);save();openProject(id,5)}function publish(c){let p=c.publish||{};return `<div class="panel"><b>PUBLISH</b><p class="note">只有启用的平台计入完成。</p>${['Instagram','Xiaohongshu','TikTok'].map(x=>`<label class="item" style="display:block"><input type="checkbox" ${p[x]?.on?'checked':''} onchange="togglePlatform(${c.id},'${x}',this.checked)"> ${x}</label>`).join('')}<button class="wide" onclick="complete(${c.id},6)">✓ ALL ENABLED PUBLISHED</button></div>`}function togglePlatform(id,n,on){let c=data.find(x=>x.id===id);c.publish[n]={...(c.publish[n]||{}),on};save()}function review(c){return `<div class="panel"><b>REVIEW</b><textarea id="worked" class="input" placeholder="What Worked">${esc(c.review.worked||'')}</textarea><textarea id="improve" class="input" placeholder="Improve">${esc(c.review.improve||'')}</textarea><div class="two"><textarea id="keep" class="input" placeholder="KEEP">${esc(c.review.keep||'')}</textarea><textarea id="try" class="input" placeholder="TRY">${esc(c.review.try||'')}</textarea></div><textarea id="stop" class="input" placeholder="STOP">${esc(c.review.stop||'')}</textarea><button class="wide" onclick="finishReview(${c.id})">✓ 完成 Content</button></div>`}function finishReview(id){let c=data.find(x=>x.id===id);c.review={worked:$('worked').value,improve:$('improve').value,keep:$('keep').value,try:$('try').value,stop:$('stop').value};c.stage=8;save();render();closeSheet()}function complete(id,t){let c=data.find(x=>x.id===id);if(t>=c.stage)c.stage=Math.min(8,t+1);save();render();openProject(id,Math.min(7,c.stage))}function openInbox(){show(`<div class="sheetTop"><b>📥 INSPIRATION INBOX</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><input id="inTitle" class="input" placeholder="Reference name"><input id="inLink" class="input" placeholder="Link"><button class="wide" onclick="addInbox()">＋ Add</button>${inbox.map(x=>`<div class="item">${esc(x.title)}<div class="note">${esc(x.link)}</div></div>`).join('')}</div>`)}function addInbox(){inbox.unshift({title:$('inTitle').value||'Reference',link:$('inLink').value});save();render();openInbox()}function gear(){show(`<div class="sheetTop"><b>🎒 TRAVEL GEAR</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel">${gearData.map((g,i)=>`<label class="item" style="display:block"><input type="checkbox" ${g.done?'checked':''} onchange="gearData[${i}].done=this.checked;save();render()"> ${esc(g.name)}</label>`).join('')}<input id="gn" class="input" placeholder="Add gear"><button class="wide" onclick="gearData.push({name:$('gn').value,done:false});save();gear()">＋ Add Gear</button></div>`)}render();</script></body></html>
