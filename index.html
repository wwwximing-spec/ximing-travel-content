<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XIMING Travel Content</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#171714;--muted:#8b8981;--line:#e8e4da;--yellow:#f2c94c;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:22px 16px 110px}button,input,textarea,select{font:inherit}button{cursor:pointer}h1{font-size:24px;margin:0}.sub,.muted{font-size:12px;color:var(--muted)}.top,.cardTop,.sectionHead,.sheetTop{display:flex;justify-content:space-between;align-items:flex-start}.pill,.filter,.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.trip,.filters,.pipeline,.inbox,.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0;-webkit-overflow-scrolling:touch}.active{background:#171714!important;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.mini{min-height:105px}.big{font-size:20px;font-weight:750;margin-top:6px}.sectionHead{margin-top:22px}.sectionHead h2{font-size:16px;margin:0}.thumb{min-width:92px;height:118px;border-radius:15px;background:#e8e4da;display:flex;align-items:end;padding:9px;font-size:11px}.title{font-size:18px;font-weight:760;margin:4px 0}.stage{min-width:66px;text-align:center}.dot{height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f2f1ed;color:#aaa}.done .dot{background:#deddd8;color:#777}.current .dot{background:var(--yellow);color:#332900;box-shadow:0 0 0 4px rgba(242,201,76,.18)}.stageName{font-size:10px;color:#888;margin-top:5px}.bar{height:5px;background:#eeeae1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#222}.cardActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.cardActions button,.yellowBtn,.ghostBtn,.dangerBtn{border:0;border-radius:12px;padding:11px}.primary{background:#171714;color:#fff}.delete,.dangerBtn{background:#fff0ee;color:var(--danger)}.ghostBtn{background:#f2f1ed}.empty{text-align:center;padding:40px 18px;color:#8b8981}.fab{position:fixed;right:20px;bottom:24px;border:0;background:#171714;color:#fff;border-radius:18px;padding:15px 18px;font-weight:700;z-index:3}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}.overlay.show{display:flex}.sheet{background:var(--bg);width:100%;max-height:92vh;border-radius:26px 26px 0 0;padding:18px 16px 32px;overflow:auto}.close{border:0;border-radius:50%;width:34px;height:34px}.tab.active{background:var(--yellow)!important;color:#111}.shot{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.ref{width:70px;height:70px;border-radius:13px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}.shotInfo{flex:1}.shotInfo small{display:block;color:#888;margin-top:4px}.check{border:0;width:38px;height:38px;border-radius:50%;background:#eee;flex:none}.check.done{background:#d9d8d2}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff}.yellowBtn{width:100%;background:var(--yellow);font-weight:800}.note{font-size:12px;color:#777;line-height:1.5}.row{display:flex;gap:8px}.row>*{flex:1}.smallBtn{border:0;border-radius:10px;padding:8px 10px;background:#f2f1ed}.refItem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#171714;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:10}.toast.show{display:block}@media(min-width:700px){.fab{right:calc(50% - 340px)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>XIMING TRAVEL CONTENT</h1><div class="sub">Plan · Shoot · Edit · Publish</div></div><button class="pill" onclick="openInbox()">📥 Inbox</button></div>
  <div class="trip"><button class="pill active">🇯🇵 Japan 2026</button><button class="pill" onclick="newTrip()">＋ 新旅行</button></div>
  <div class="grid">
    <div class="mini"><b>TODAY</b><div class="big">📍 —</div><div class="muted">从 Content 的拍摄阶段开始安排</div></div>
    <div class="mini" onclick="gear()"><b>🎒 TRAVEL GEAR</b><div class="big" id="gearCount">0 / 0</div><div class="muted">Tap to manage gear</div></div>
  </div>
  <div class="sectionHead"><h2>灵感 INBOX</h2><span class="muted">先收集，之后再分类</span></div>
  <div class="inbox" id="inboxPreview"><div class="thumb" onclick="openInbox()">＋ 添加</div></div>
  <div class="sectionHead"><h2>MY CONTENT</h2><span class="muted">Auto saved</span></div>
  <div class="filters">
    <button class="filter active" data-filter="all" onclick="setFilter('all',this)">全部</button>
    <button class="filter" data-filter="active" onclick="setFilter('active',this)">🟡 进行中</button>
    <button class="filter" data-filter="VIDEO" onclick="setFilter('VIDEO',this)">🎬 Video</button>
    <button class="filter" data-filter="PHOTO" onclick="setFilter('PHOTO',this)">📸 Photo</button>
    <button class="filter" data-filter="done" onclick="setFilter('done',this)">✓ 已完成</button>
  </div>
  <div id="cards"></div>
</div>
<button class="fab" onclick="newContent()">＋ NEW CONTENT</button>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const STAGES_VIDEO=['参考','规划','Shot List','拍摄','素材','剪辑','发布','复盘'];
const STAGES_PHOTO=['参考','规划','Shot List','拍摄','素材','修图','发布','复盘'];
let data=JSON.parse(localStorage.getItem('ximingTravelV3')||'[]');
let inbox=JSON.parse(localStorage.getItem('ximingInboxV3')||'[]');
let gearData=JSON.parse(localStorage.getItem('ximingGearV3')||'[]');
let currentFilter='all';
function save(){localStorage.setItem('ximingTravelV3',JSON.stringify(data));localStorage.setItem('ximingInboxV3',JSON.stringify(inbox));localStorage.setItem('ximingGearV3',JSON.stringify(gearData))}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function render(){renderCards();renderInboxPreview();renderGearCount();save()}
function renderCards(){const el=document.getElementById('cards');let list=data.filter(c=>currentFilter==='all'||currentFilter==='active'?(currentFilter==='all'||c.stage<c.stages.length):currentFilter==='done'?c.stage>=c.stages.length:c.type===currentFilter);if(!list.length){el.innerHTML='<div class="card empty"><b>这里还没有 Content</b><p>按右下角 ＋ NEW CONTENT 建立项目。</p></div>';return}el.innerHTML=list.map(c=>{const pct=Math.min(100,Math.round(c.stage/c.stages.length*100));const stages=c.stages.map((s,i)=>'<div class="stage '+(i<c.stage?'done':i===c.stage&&c.stage<c.stages.length?'current':'')+'"><div class="dot">'+(i<c.stage?'✓':String(i+1).padStart(2,'0'))+'</div><div class="stageName">'+s+'</div></div>').join('');return '<div class="card"><div class="cardTop"><div><div class="muted">'+(c.type==='VIDEO'?'🎬 VIDEO':'📸 PHOTO')+'</div><div class="title">'+esc(c.title)+'</div><div class="muted">'+esc(c.place)+'</div></div><div>'+pct+'%</div></div><div class="pipeline">'+stages+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="cardActions"><button onclick="duplicateContent('+c.id+')">⧉ 复制</button><button class="delete" onclick="deleteContent('+c.id+')">🗑 删除</button><button class="primary" onclick="openProject('+c.id+')">打开 →</button></div></div>'}).join('')}
function renderInboxPreview(){const p=document.getElementById('inboxPreview');p.innerHTML=inbox.slice(0,5).map(x=>'<div class="thumb" onclick="openInbox()">'+esc(x.title||'Reference')+'</div>').join('')+'<div class="thumb" onclick="openInbox()">＋ 添加</div>'}
function renderGearCount(){document.getElementById('gearCount').textContent=gearData.filter(x=>x.done).length+' / '+gearData.length}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderCards()}
function duplicateContent(id){const src=data.find(x=>x.id===id);if(!src)return;const c=JSON.parse(JSON.stringify(src));c.id=Date.now();c.title+=' COPY';c.stage=0;c.shots=(c.shots||[]).map(s=>({...s,done:false,status:''}));data.unshift(c);render();toastMsg('已复制')}
function deleteContent(id){const c=data.find(x=>x.id===id);if(!c)return;if(confirm('确定删除「'+c.title+'」吗？')){data=data.filter(x=>x.id!==id);render();closeSheet();toastMsg('已删除')}}
function closeSheet(){overlay.classList.remove('show')}
function show(h){sheet.innerHTML=h;overlay.classList.add('show')}
function newContent(){show('<div class="sheetTop"><b>＋ NEW CONTENT</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><select id="ctype" class="input"><option value="VIDEO">🎬 VIDEO</option><option value="PHOTO">📸 PHOTO</option></select><input id="ctitle" class="input" placeholder="Content Title"><input id="cplace" class="input" placeholder="地点 / 日期"><textarea id="cidea" class="input" placeholder="我想拍什么 / Content Idea"></textarea><button class="yellowBtn" onclick="createContent()">建立 Content</button><p class="note">建立后会进入 Reference → Planning → Shot List → Shoot → Material → Edit/Retouch → Publish → Review。</p></div>')}
function createContent(){const type=document.getElementById('ctype').value,title=document.getElementById('ctitle').value.trim()||'UNTITLED CONTENT',place=document.getElementById('cplace').value.trim()||'Location TBD',idea=document.getElementById('cidea').value.trim();data.unshift({id:Date.now(),type,title,place,idea,stage:0,stages:type==='PHOTO'?STAGES_PHOTO:STAGES_VIDEO,references:[],planning:{},shots:[],material:[],publish:{},review:{}});render();closeSheet();toastMsg('Content 已建立')}
function openProject(id,tab){const c=data.find(x=>x.id===id);if(!c)return;const activeTab=tab===undefined?Math.min(c.stage,c.stages.length-1):tab;const tabs=c.stages.map((s,i)=>'<button class="tab '+(i===activeTab?'active':'')+'" onclick="openProject('+id+','+i+')">'+(i<c.stage?'✓ ':i===c.stage&&c.stage<c.stages.length?'🟡 ':'')+s+'</button>').join('');show('<div class="sheetTop"><div><b>'+(c.type==='VIDEO'?'🎬 ':'📸 ')+esc(c.title)+'</b><div class="muted">'+esc(c.place)+'</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="tabs">'+tabs+'</div>'+sectionBody(c,activeTab))}
function sectionBody(c,tab){if(tab===0)return referenceSection(c);if(tab===1)return planningSection(c);if(tab===2)return shotListSection(c);if(tab===3)return shootSection(c);if(tab===4)return materialSection(c);if(tab===5)return editSection(c);if(tab===6)return publishSection(c);return reviewSection(c)}
function referenceSection(c){const refs=(c.references||[]).map((r,i)=>'<div class="refItem"><b>'+esc(r.title)+'</b><div class="muted">'+esc(r.note||'')+'</div><div class="row" style="margin-top:8px"><button class="smallBtn" onclick="addRefToShot('+c.id+','+i+')">＋ Shot List</button><button class="smallBtn" onclick="removeRef('+c.id+','+i+')">删除</button></div></div>').join('');return '<div class="panel"><b>REFERENCE</b><p class="note">把你真正想参考的照片 / 视频 / Screenshot / Link 放这里。</p>'+refs+'<input id="rtitle" class="input" placeholder="Reference 名称"><input id="rnote" class="input" placeholder="来源 / Pose / 构图 / 备注"><button class="ghostBtn" style="width:100%" onclick="addReference('+c.id+')">＋ Add Reference</button><div style="height:8px"></div><button class="yellowBtn" onclick="completeStage('+c.id+',0)">✓ 完成参考阶段</button></div>'}
function addReference(id){const c=data.find(x=>x.id===id);const t=document.getElementById('rtitle').value.trim();if(!t)return toastMsg('先写 Reference 名称');c.references.push({title:t,note:document.getElementById('rnote').value.trim()});save();openProject(id,0)}
function removeRef(id,i){const c=data.find(x=>x.id===id);c.references.splice(i,1);save();openProject(id,0)}
function addRefToShot(id,i){const c=data.find(x=>x.id===id),r=c.references[i];c.shots.push({title:r.title,details:r.note||'来自 Reference',done:false,status:''});save();toastMsg('已加入 Shot List')}
function planningSection(c){return '<div class="panel"><b>CONTENT BRIEF</b><input id="ptitle" class="input" value="'+esc(c.title)+'" placeholder="Content Title"><input id="pplace" class="input" value="'+esc(c.place)+'" placeholder="地点 / 日期"><textarea id="pidea" class="input" placeholder="Content Idea / Hook / Ending">'+esc(c.idea||'')+'</textarea><textarea id="plook" class="input" placeholder="Style / Mood / Outfit / Look">'+esc(c.planning?.look||'')+'</textarea><button class="ghostBtn" style="width:100%" onclick="savePlanning('+c.id+')">保存规划</button><div style="height:8px"></div><button class="yellowBtn" onclick="savePlanning('+c.id+',true)">✓ 完成规划</button></div>'}
function savePlanning(id,done){const c=data.find(x=>x.id===id);c.title=document.getElementById('ptitle').value.trim()||c.title;c.place=document.getElementById('pplace').value.trim()||c.place;c.idea=document.getElementById('pidea').value;c.planning={look:document.getElementById('plook').value};save();render();if(done)completeStage(id,1);else toastMsg('已保存')}
function shotRows(c,mode){if(!(c.shots||[]).length)return '<div class="empty">还没有 Shot。先在这里加，或从 Reference 加入。</div>';return c.shots.map((s,i)=>'<div class="shot"><div class="ref">'+(c.type==='VIDEO'?'🎥':'📸')+'</div><div class="shotInfo"><b>'+String(i+1).padStart(2,'0')+' · '+esc(s.title)+'</b><small>'+esc(s.details||'')+'</small></div>'+(mode==='shoot'?'<button class="check '+(s.done?'done':'')+'" onclick="toggleShot('+c.id+','+i+')">'+(s.done?'✓':'')+'</button>':'<button class="smallBtn" onclick="removeShot('+c.id+','+i+')">×</button>')+'</div>').join('')}
function shotListSection(c){return '<div class="panel"><b>SHOT LIST</b><p class="note">拍摄前设计镜头；Reference 可以直接变成 Shot。</p>'+shotRows(c,'list')+'<input id="stitle" class="input" placeholder="Shot 名称"><input id="sdetails" class="input" placeholder="地点 / Pose / 构图 / 运镜 / 时长"><button class="ghostBtn" style="width:100%" onclick="addShot('+c.id+')">＋ Add Shot</button><div style="height:8px"></div><button class="yellowBtn" onclick="completeStage('+c.id+',2)">✓ 完成 Shot List</button></div>'}
function addShot(id){const c=data.find(x=>x.id===id),t=document.getElementById('stitle').value.trim();if(!t)return toastMsg('先写 Shot 名称');c.shots.push({title:t,details:document.getElementById('sdetails').value.trim(),done:false,status:''});save();openProject(id,2)}
function removeShot(id,i){const c=data.find(x=>x.id===id);c.shots.splice(i,1);save();openProject(id,2)}
function shootSection(c){const done=(c.shots||[]).filter(s=>s.done).length,total=(c.shots||[]).length;return '<div class="panel"><b>SHOOT MODE · '+done+'/'+total+'</b><p class="note">拍到了就打 ✓。没拍到的保持未完成，之后补拍。</p>'+shotRows(c,'shoot')+'<button class="yellowBtn" onclick="completeStage('+c.id+',3)">✓ 完成拍摄阶段</button></div>'}
function toggleShot(id,i){const c=data.find(x=>x.id===id);c.shots[i].done=!c.shots[i].done;save();openProject(id,3)}
function materialSection(c){return '<div class="panel"><b>MATERIAL</b><p class="note">这里只确认哪些 Shot 可用，不是把整相册上传进来。</p>'+((c.shots||[]).map((s,i)=>'<div class="shot"><div class="shotInfo"><b>'+esc(s.title)+'</b><small>'+esc(s.status||'未选择状态')+'</small></div><select class="input" style="width:120px" onchange="setMaterialStatus('+c.id+','+i+',this.value)"><option value="">状态</option><option value="⭐ Best">⭐ Best</option><option value="✓ Usable">✓ Usable</option><option value="△ Backup">△ Backup</option><option value="✕ Missing">✕ Missing</option></select></div>').join(''))+'<button class="yellowBtn" onclick="completeStage('+c.id+',4)">✓ 完成素材阶段</button></div>'}
function setMaterialStatus(id,i,v){const c=data.find(x=>x.id===id);c.shots[i].status=v;save()}
function editSection(c){const label=c.type==='PHOTO'?'RETOUCH':'EDIT';return '<div class="panel"><b>'+label+'</b><p class="note">'+(c.type==='PHOTO'?'选片 → 修图 → 调色 → 检查 → 导出':'选素材 → 故事线 → 粗剪 → 精剪 → 音乐 → 字幕 → 音效 → 调色 → 封面 → 导出')+'</p><textarea id="editnote" class="input" placeholder="记录剪辑 / 修图进度与备注">'+esc(c.editNote||'')+'</textarea><button class="ghostBtn" style="width:100%" onclick="saveEdit('+c.id+')">保存</button><div style="height:8px"></div><button class="yellowBtn" onclick="completeStage('+c.id+',5)">✓ 完成'+(c.type==='PHOTO'?'修图':'剪辑')+'</button></div>'}
function saveEdit(id){const c=data.find(x=>x.id===id);c.editNote=document.getElementById('editnote').value;save();toastMsg('已保存')}
function publishSection(c){return '<div class="panel"><b>PUBLISH</b><input id="pubtitle" class="input" placeholder="发布标题" value="'+esc(c.publish?.title||'')+'"><textarea id="pubcaption" class="input" placeholder="Caption">'+esc(c.publish?.caption||'')+'</textarea><select id="pubplatform" class="input"><option>Instagram Reels</option><option>TikTok</option><option>小红书</option></select><button class="ghostBtn" style="width:100%" onclick="savePublish('+c.id+')">保存发布资料</button><div style="height:8px"></div><button class="yellowBtn" onclick="savePublish('+c.id+',true)">✓ 已发布 / 完成发布阶段</button></div>'}
function savePublish(id,done){const c=data.find(x=>x.id===id);c.publish={title:document.getElementById('pubtitle').value,caption:document.getElementById('pubcaption').value,platform:document.getElementById('pubplatform').value};save();if(done)completeStage(id,6);else toastMsg('已保存')}
function reviewSection(c){return '<div class="panel"><b>REVIEW</b><textarea id="worked" class="input" placeholder="What Worked">'+esc(c.review?.worked||'')+'</textarea><textarea id="improve" class="input" placeholder="Improve / 下次要改什么">'+esc(c.review?.improve||'')+'</textarea><textarea id="try" class="input" placeholder="KEEP / STOP / TRY">'+esc(c.review?.try||'')+'</textarea><button class="ghostBtn" style="width:100%" onclick="saveReview('+c.id+')">保存复盘</button><div style="height:8px"></div><button class="yellowBtn" onclick="saveReview('+c.id+',true)">✓ 完成整个 Content</button></div>'}
function saveReview(id,done){const c=data.find(x=>x.id===id);c.review={worked:document.getElementById('worked').value,improve:document.getElementById('improve').value,try:document.getElementById('try').value};save();if(done)completeStage(id,7);else toastMsg('已保存')}
function completeStage(id,tab){const c=data.find(x=>x.id===id);if(tab>=c.stage)c.stage=Math.min(tab+1,c.stages.length);save();render();if(c.stage>=c.stages.length){closeSheet();toastMsg('✓ COMPLETED · 100%')}else openProject(id,c.stage)}
function openInbox(){const rows=inbox.map((x,i)=>'<div class="refItem"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.note||'')+'</div><button class="smallBtn" style="margin-top:8px" onclick="deleteInbox('+i+')">删除</button></div>').join('');show('<div class="sheetTop"><b>📥 灵感 INBOX</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel"><p class="note">暂时不知道放哪个 Content 的灵感先放这里。</p>'+rows+'<input id="ititle" class="input" placeholder="灵感名称"><input id="inote" class="input" placeholder="来源 / 备注"><button class="yellowBtn" onclick="addInbox()">＋ 加入 Inbox</button></div>')}
function addInbox(){const t=document.getElementById('ititle').value.trim();if(!t)return toastMsg('先写灵感名称');inbox.push({title:t,note:document.getElementById('inote').value.trim()});render();openInbox()}
function deleteInbox(i){inbox.splice(i,1);render();openInbox()}
function gear(){const rows=gearData.map((x,i)=>'<div class="shot"><div class="shotInfo"><b>'+esc(x.name)+'</b></div><button class="check '+(x.done?'done':'')+'" onclick="toggleGear('+i+')">'+(x.done?'✓':'')+'</button><button class="smallBtn" onclick="removeGear('+i+')">×</button></div>').join('');show('<div class="sheetTop"><b>🎒 TRAVEL GEAR</b><button class="close" onclick="closeSheet()">×</button></div><div class="panel">'+rows+'<input id="gname" class="input" placeholder="新增装备"><button class="yellowBtn" onclick="addGear()">＋ Add Gear</button></div>')}
function addGear(){const n=document.getElementById('gname').value.trim();if(!n)return;gearData.push({name:n,done:false});render();gear()}
function toggleGear(i){gearData[i].done=!gearData[i].done;render();gear()}
function removeGear(i){gearData.splice(i,1);render();gear()}
function newTrip(){toastMsg('新旅行管理下一版接上；现在先 Run Content 流程')}
overlay.addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
render();
</script>
</body>
</html>
